# Один файл: CPU и GPU через profiles (нужен ровно один профиль).
#
# CPU:  docker compose --profile cpu up --build -d
# GPU:  docker compose --profile gpu up --build -d
#
# Переменные (опционально в .env):
#   TORCH_INDEX_URL  — URL колёс torch (cpu / cu124)
#   TORCH_VERSION    — версия torch
#   API_PORT         — порт API

x-api: &api
  image: llm-finetune-classification:latest
  container_name: llm-finetune-api
  ports:
    - "${API_PORT:-8000}:8000"
  env_file:
    - .env
  environment: &api-env
    PYTHONUNBUFFERED: "1"
    PYTHONPATH: /app/src
    HF_HOME: /app/.cache/huggingface
    TRANSFORMERS_CACHE: /app/.cache/huggingface
    SFT_OUTPUT: /app/sft_output
    SFT_OUTPUT_PEFT: /app/sft_output_peft
  volumes:
    - ./sft_output:/app/sft_output
    - ./sft_output_peft:/app/sft_output_peft
    - hf_cache:/app/.cache/huggingface
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
    interval: 30s
    timeout: 10s
    start_period: 120s
    retries: 3

services:
  # ── CPU (Mac, сервер без NVIDIA) ───────────────────────────
  api:
    <<: *api
    profiles: ["cpu"]
    shm_size: 8589934592   # 8 GiB
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        TORCH_VERSION: ${TORCH_VERSION:-2.12.0}

  # ── GPU (RTX 4090 + NVIDIA Container Toolkit) ──────────────
  api-gpu:
    <<: *api
    profiles: ["gpu"]
    shm_size: 17179869184  # 16 GiB
    # вместо gpus: all (нет в JSON Schema Compose IDE)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      <<: *api-env
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu124}
        TORCH_VERSION: ${TORCH_VERSION:-2.12.0}

volumes:
  hf_cache:
